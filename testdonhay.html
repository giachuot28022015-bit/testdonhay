<style>
:root{--bg:#04060e;--bg2:#09101f;--card:#0b1428;--tx:#e8f4ff;--mu:#8ea6c9;--ac:#3db8ff;--ac2:#b8ecff;--ok:#37e29a;--bd:#1b3366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light) and (max-width:0px){:root:not([data-theme="dark"]){--bg:#f6f3ff;--bg2:#e9e3ff;--card:#fff;--tx:#1a1537;--mu:#5e578f;--bd:#cfc6f5}}
:root[data-theme="light"]{--bg:#f6f3ff;--bg2:#e9e3ff;--card:#fff;--tx:#1a1537;--mu:#5e578f;--bd:#cfc6f5}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;font-size:17px;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--ac),#2f5bff);color:#fff;font-weight:700;padding:12px 22px;border-radius:12px;transition:transform .15s,box-shadow .2s;box-shadow:0 6px 24px #3db8ff55}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px #3db8ff88}
.btn.ghost{background:transparent;border:2px solid var(--bd);box-shadow:none;color:var(--tx)}
.rip{position:absolute;border-radius:50%;background:#fff6;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* auth */
#auth{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:min(420px,100%);background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:28px;box-shadow:0 20px 60px #0007;animation:pop .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.9)}}
.logo{font-size:2.3rem;font-weight:800;line-height:1;letter-spacing:.5px;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite}
@keyframes flow{to{background-position:200%}}
.tabs{display:flex;gap:6px;margin:18px 0;background:var(--bg2);padding:5px;border-radius:12px}
.tabs button{flex:1;padding:9px;border-radius:9px;background:transparent;color:var(--mu);font-weight:700;transition:.25s}
.tabs button.on{background:var(--ac);color:#fff}
label{display:block;margin:12px 0 5px;color:var(--mu);font-size:.95rem}
input{width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--bd);background:var(--bg2);transition:border .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px #3db8ff33}
.err{color:#ff6b81;min-height:1.4em;margin:10px 0 4px;font-size:.95rem}
.note{color:var(--mu);font-size:.85rem;margin-top:14px}
/* app */
#app{display:none;position:relative;z-index:1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
#burger{width:46px;height:46px;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:grid;place-content:center;gap:5px;flex:none}
#burger i{display:block;width:22px;height:3px;background:var(--ac);border-radius:3px;transition:.35s}
#burger.open i:nth-child(1){transform:translateY(8px) rotate(45deg)}
#burger.open i:nth-child(2){opacity:0;transform:scaleX(0)}
#burger.open i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.sw{position:relative;flex:1;max-width:640px;margin:0 auto}
.sw input{padding-left:42px;border-radius:30px}
.sw svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:20px;fill:none;stroke:var(--mu);stroke-width:2.5}
#sug{position:absolute;left:0;right:0;top:110%;background:var(--card);border:1px solid var(--bd);border-radius:14px;max-height:55vh;overflow:auto;display:none;box-shadow:0 14px 40px #0008}
#sug button{display:flex;justify-content:space-between;width:100%;padding:11px 16px;background:transparent;text-align:left}
#sug button:hover,#sug button:focus-visible{background:var(--bg2)}
#sug small{color:var(--mu)}
#shade{position:fixed;inset:0;z-index:30;background:#0009;opacity:0;pointer-events:none;transition:.35s}
#shade.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;z-index:40;width:min(300px,84vw);padding:calc(24px + env(safe-area-inset-top,0px)) 18px 24px;background:linear-gradient(170deg,var(--bg2),var(--card));border-right:1px solid var(--bd);transform:translateX(-105%);transition:transform .45s cubic-bezier(.2,.9,.25,1);box-shadow:20px 0 60px #0008;display:flex;flex-direction:column;gap:6px}
#drawer.on{transform:none}
#drawer .hi{margin:6px 0 16px;color:var(--mu)}
#drawer .hi b{color:var(--ac2);display:block;font-size:1.2rem}
.nav{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:transparent;text-align:left;font-weight:600;opacity:0;transform:translateX(-24px);transition:background .2s,padding .2s}
#drawer.on .nav{opacity:1;transform:none;transition:opacity .4s,transform .4s,background .2s,padding .2s}
#drawer.on .nav:nth-of-type(1){transition-delay:.12s}#drawer.on .nav:nth-of-type(2){transition-delay:.19s}#drawer.on .nav:nth-of-type(3){transition-delay:.26s}#drawer.on .nav:nth-of-type(4){transition-delay:.33s}#drawer.on .nav:nth-of-type(5){transition-delay:.4s}
.nav:hover,.nav.cur{background:linear-gradient(90deg,#3db8ff33,transparent);padding-left:22px}
.nav.cur{border-left:4px solid var(--ac)}
main{max-width:980px;margin:0 auto;padding:22px 16px 60px}
h2{font-size:1.9rem;margin-bottom:6px}
.sub{color:var(--mu);margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:7px 15px;border-radius:20px;background:var(--card);border:1px solid var(--bd);transition:.2s;font-weight:600}
.chip.on,.chip:hover{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ph{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:left;transition:transform .25s,border .25s,box-shadow .25s;animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.ph:hover{transform:translateY(-5px) rotate(-.6deg);border-color:var(--ac);box-shadow:0 12px 30px #3db8ff33}
.ph b{display:block}.ph span{color:var(--mu);font-size:.9rem}
.tag{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:10px;font-size:.8rem;font-weight:700;background:#37e29a22;color:var(--ok)}
.tag.m{background:#b8ecff22;color:var(--ac2)}.tag.l{background:#ff6b8122;color:#ff6b81}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;margin-bottom:18px;animation:in .5s both}
.row{display:flex;align-items:center;gap:12px;margin:12px 0}
.row span:first-child{width:112px;flex:none}
.bar{flex:1;height:14px;background:var(--bg2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:8px;transition:width 1.1s cubic-bezier(.2,.9,.3,1)}
.row b{width:42px;text-align:right;font-size:1.15rem;color:var(--ac2)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stage{position:relative;height:250px;border-radius:16px;border:2px solid var(--bd);background:radial-gradient(circle at 30% 40%,#13306b,#050914);overflow:hidden;margin:14px 0}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 38px,#ffffff08 38px 39px),repeating-linear-gradient(90deg,transparent 0 38px,#ffffff08 38px 39px)}
#fb{position:absolute;right:14%;bottom:18%;translate:50% 50%;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle,#ff9d3d,#e0261f);box-shadow:0 0 24px #ff3d3d99;transition:width .25s,height .25s,opacity .25s;touch-action:manipulation}
#fb:active{scale:.9}
.shot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--ac2);pointer-events:none;animation:sh .7s ease-out forwards}
@keyframes sh{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
input[type=range]{padding:0;height:8px;accent-color:var(--ac);border:0;box-shadow:none}
.empty{color:var(--mu);padding:30px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 90px;background:var(--ok);color:#06251a;font-weight:700;padding:11px 20px;border-radius:30px;z-index:60;transition:translate .4s cubic-bezier(.2,1.4,.4,1)}
#toast.on{translate:-50% 0}

<script>
const DB=JSON.parse(document.getElementById("phones").textContent);
const ALL=[];for(const b in DB)DB[b].forEach(n=>{const t=n.endsWith("+")?3:n.endsWith("-")?1:2;ALL.push({n:n.replace(/[+-]$/,""),b,t})});
const $=s=>document.querySelector(s);
const H=s=>{let x=7;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;return x};
const R=(s,k,lo,hi)=>lo+H(s+k)%(hi-lo+1);
const RG={3:{g:[95,100],r:[92,99],x2:[90,97],x4:[86,94],sn:[78,88],fl:[85,95],dpi:[44,52],sz:[50,62],op:[60,85]},2:{g:[88,96],r:[85,94],x2:[82,91],x4:[78,88],sn:[70,82],fl:[78,90],dpi:[40,46],sz:[48,58],op:[55,80]},1:{g:[80,90],r:[78,88],x2:[74,85],x4:[70,82],sn:[62,75],fl:[70,82],dpi:[36,42],sz:[45,55],op:[50,75]}};
function calc(p){const r=RG[p.t],o={};for(const k of["g","r","x2","x4","sn","fl"])o[k]=R(p.n,k,r[k][0]*2,r[k][1]*2);o.dpi=R(p.n,"d",...r.dpi)*10;o.sz=R(p.n,"s",...r.sz);o.op=R(p.n,"o",...r.op);o.fing=p.t==3?4:p.t==2?3:2;return o}
const LAB=[["g","Tổng quát"],["r","Red Dot"],["x2","Ống ngắm 2x"],["x4","Ống ngắm 4x"],["sn","AWM / Sniper"],["fl","Nhìn tự do"]];
const TL={3:["Máy mạnh","","Mượt, kéo tâm nhanh"],2:["Máy tầm trung","m","Cân bằng, dễ kiểm soát"],1:["Máy yếu","l","Nên giảm nhạy cho ổn định"]};
let me=null,view="sensi",cur=ALL.find(p=>p.n=="iPhone 13 Pro"),brand="Tất cả",mode="login";
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const users=()=>{try{return JSON.parse(ls.get("ffs_users")||"{}")}catch(e){return{}}};
const favs=()=>{try{return JSON.parse(ls.get("ffs_fav_"+me)||"[]")}catch(e){return[]}};
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ffs:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"h"+H(s)}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1900)}
document.addEventListener("click",e=>{const b=e.target.closest(".btn,.chip,.nav");if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement("span");s.className="rip";const d=Math.max(r.width,r.height);s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)});
/* auth */
function setMode(m){mode=m;$("#tL").classList.toggle("on",m=="login");$("#tR").classList.toggle("on",m=="reg");$("#p2w").style.display=m=="reg"?"block":"none";$("#go").textContent=m=="reg"?"Tạo tài khoản":"Đăng nhập";$("#err").textContent=""}
$("#tL").onclick=()=>setMode("login");$("#tR").onclick=()=>setMode("reg");
async function submit(){const u=$("#u").value.trim(),p=$("#p").value,U=users(),k=u.toLowerCase(),er=$("#err");
 if(u.length<3)return er.textContent="Tên tài khoản cần ít nhất 3 ký tự.";
 if(p.length<6)return er.textContent="Mật khẩu cần ít nhất 6 ký tự.";
 if(mode=="reg"){if(p!==$("#p2").value)return er.textContent="Hai mật khẩu chưa giống nhau.";if(U[k])return er.textContent="Tên này đã có người dùng, hãy chọn tên khác.";U[k]={name:u,h:await hash(p),t:Date.now()};ls.set("ffs_users",JSON.stringify(U))}
 else{if(!U[k]||U[k].h!==await hash(p))return er.textContent="Sai tên tài khoản hoặc mật khẩu."}
 ls.set("ffs_session",k);enter(k)}
$("#go").onclick=submit;["u","p","p2"].forEach(i=>$("#"+i).addEventListener("keydown",e=>{if(e.key=="Enter")submit()}));
function enter(k){me=k;const U=users();$("#who").textContent=U[k]?U[k].name:k;$("#auth").style.display="none";$("#app").style.display="block";go("sensi")}
$("#out").onclick=()=>{ls.set("ffs_session","");me=null;menu(false);$("#app").style.display="none";$("#auth").style.display="grid";$("#p").value="";$("#p2").value=""};
/* menu */
function menu(o){$("#drawer").classList.toggle("on",o);$("#shade").classList.toggle("on",o);$("#burger").classList.toggle("open",o);$("#burger").setAttribute("aria-label",o?"Đóng menu":"Mở menu")}
$("#burger").onclick=()=>menu(!$("#drawer").classList.contains("on"));$("#shade").onclick=()=>menu(false);
document.addEventListener("keydown",e=>{if(e.key=="Escape")menu(false)});
document.querySelectorAll(".nav[data-v]").forEach(b=>b.onclick=()=>{go(b.dataset.v);menu(false)});
function go(v){const f=v=="fire";view=f?"sensi":v;document.querySelectorAll(".nav[data-v]").forEach(b=>b.classList.toggle("cur",b.dataset.v==v));render();const fb=document.getElementById("firebox");f&&fb?fb.scrollIntoView({behavior:"smooth"}):scrollTo({top:0,behavior:"smooth"})}
/* search */
const q=$("#q"),sug=$("#sug");
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/\s+/g,"").replace(/galaxy/g,"");
const find=t=>{const k=norm(t);return k?ALL.filter(p=>norm(p.n).includes(k)||norm(p.b).includes(k)):ALL};
q.oninput=()=>{const A=find(q.value);if(A.length&&q.value.trim())cur=A[0];const r=A.slice(0,8);if(!q.value.trim()||!r.length){sug.style.display="none";if(view=="sensi")render();return}
 sug.innerHTML=r.map(p=>`<button data-n="${p.n}">${p.n}<small>${p.b}</small></button>`).join("");sug.style.display="block";if(view=="sensi")render()};
sug.onclick=e=>{const b=e.target.closest("button");if(!b)return;pick(ALL.find(p=>p.n==b.dataset.n));q.value=b.dataset.n;sug.style.display="none"};
document.addEventListener("click",e=>{if(!e.target.closest(".sw"))sug.style.display="none"});
q.onkeydown=e=>{if(e.key=="Enter"){const r=find(q.value);if(r.length){pick(r[0]);sug.style.display="none"}}};
function pick(p){cur=p;if(view!="sensi"&&view!="fire")view="sensi";go(view)}
/* render */
const card=p=>`<button class="ph" data-n="${p.n}"><b>${p.n}</b><span>${p.b}</span><br><span class="tag ${TL[p.t][1]}">${TL[p.t][0]}</span></button>`;
function detail(){const p=cur,c=calc(p),fv=favs().includes(p.n);
 return `<div class="panel"><h2>${esc(p.n)}</h2><p class="sub">${TL[p.t][0]} · ${TL[p.t][2]}</p>
 ${LAB.map(([k,l])=>`<div class="row"><span>${l}</span><div class="bar"><i data-w="${c[k]/2}"></i></div><b>${c[k]}</b></div>`).join("")}
 <div class="row"><span>DPI gợi ý</span><b style="width:auto">${c.dpi}</b></div>
 <div class="acts"><button class="btn" id="cp">Sao chép thông số</button><button class="btn ghost" id="fv">${fv?"★ Đã lưu":"☆ Lưu máy này"}</button></div>
 <p class="note">Đây là mức gợi ý để bạn bắt đầu, không phải số chính thức của Garena. Hãy vào phòng tập và tăng giảm 3–5 điểm cho vừa tay.</p></div>`}
function bind(){document.querySelectorAll(".ph").forEach(b=>b.onclick=()=>{cur=ALL.find(p=>p.n==b.dataset.n);if(view!="fire")view="sensi";render();scrollTo({top:0,behavior:"smooth"})});
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".bar i").forEach(i=>i.style.width=i.dataset.w+"%")))}
function render(){const m=$("#main");
 if(view=="sensi"){const none=q.value.trim()&&!find(q.value).length&&!(cur.custom&&cur.n==q.value.trim());
  m.innerHTML=`<h2>Độ nhạy Free Fire</h2><p class="sub">Gõ tên máy ở thanh tìm kiếm phía trên, kết quả hiện ngay bên dưới.</p>${none?custom():detail()+fireBox()}`;
  if(none){m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{cur={n:q.value.trim(),b:"Khác",t:+b.dataset.t,custom:1};render()});return}
  $("#cp").onclick=()=>{const c=calc(cur),t=`${cur.n}\n`+LAB.map(([k,l])=>`${l}: ${c[k]}`).join("\n")+`\nDPI: ${c.dpi}\nNút bắn: ${c.sz}% - độ mờ ${c.op}%`;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Đã sao chép"),()=>toast("Không sao chép được, hãy chép tay"))};
  $("#fv").onclick=()=>{let f=favs();f=f.includes(cur.n)?f.filter(x=>x!=cur.n):[...f,cur.n];ls.set("ffs_fav_"+me,JSON.stringify(f));toast(f.includes(cur.n)?"Đã lưu máy":"Đã bỏ lưu");render()};
  fireInit();requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".bar i").forEach(i=>i.style.width=i.dataset.w+"%")))}
 else if(view=="fav"){const f=favs().map(n=>ALL.find(p=>p.n==n)).filter(Boolean);
  m.innerHTML=`<h2>Máy đã lưu</h2><p class="sub">Những dòng máy bạn đã đánh dấu sao.</p>${f.length?`<div class="grid">${f.map(card).join("")}</div>`:'<p class="empty">Chưa có máy nào. Mở một dòng máy ở mục Độ nhạy rồi chọn "Lưu máy này".</p>'}`;bind()}
 else{const U=users()[me]||{};
  m.innerHTML=`<h2>Tài khoản</h2><div class="panel"><div class="row"><span>Tên</span><b style="width:auto;color:var(--tx)">${U.name||me}</b></div><div class="row"><span>Ngày tạo</span><b style="width:auto;color:var(--tx)">${U.t?new Date(U.t).toLocaleDateString("vi-VN"):"—"}</b></div><div class="row"><span>Máy đã lưu</span><b style="width:auto;color:var(--tx)">${favs().length}</b></div>
  <div class="acts"><button class="btn ghost" id="th">Đổi sáng / tối</button></div></div>`;
  $("#th").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--bg").trim()=="#04060e";d.dataset.theme=dark?"light":"dark"}}}
/* tiện ích */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function custom(){return `<div class="panel"><h2>${esc(q.value.trim())}</h2><p class="sub">Máy này chưa có trong danh sách. Chọn tầm máy của bạn để xem độ nhạy phù hợp.</p><div class="acts"><button class="btn" data-t="3">Máy mạnh</button><button class="btn ghost" data-t="2">Tầm trung</button><button class="btn ghost" data-t="1">Máy yếu</button></div></div>`}
function fireBox(){const c=calc(cur);return `<div class="panel" id="firebox"><h2>🔥 Nút bắn</h2><p class="sub">${esc(cur.n)} · gợi ý ${c.fing} ngón · kích thước ${c.sz}% · độ mờ ${c.op}%. Kéo thanh trượt rồi chạm nút để thử.</p>
 <div class="stage" id="st"><button id="fb" aria-label="Nút bắn thử"></button></div>
 <div class="row"><span>Kích thước</span><input type="range" id="sz" min="30" max="100" value="${c.sz}"><b id="szv">${c.sz}%</b></div>
 <div class="row"><span>Độ mờ</span><input type="range" id="op" min="20" max="100" value="${c.op}"><b id="opv">${c.op}%</b></div>
 <div class="acts"><button class="btn" id="rs">Đặt về mức gợi ý</button><button class="btn ghost" id="cp2">Sao chép</button></div>
 <p class="note">Nút to và rõ giúp bắn trúng hơn, nhưng quá to sẽ che tầm nhìn. Đây là mức gợi ý để bắt đầu.</p></div>`}
function fireInit(){const c=calc(cur);
 const ap=()=>{const s=+$("#sz").value,o=+$("#op").value,d=40+s*0.9;$("#fb").style.cssText=`width:${d}px;height:${d}px;opacity:${o/100}`;$("#szv").textContent=s+"%";$("#opv").textContent=o+"%"};
 $("#sz").oninput=ap;$("#op").oninput=ap;ap();
 $("#rs").onclick=()=>{$("#sz").value=c.sz;$("#op").value=c.op;ap()};
 $("#cp2").onclick=()=>{const t=`${cur.n}: nút bắn ${$("#sz").value}%, độ mờ ${$("#op").value}%`;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Đã sao chép"),()=>toast("Không sao chép được"))};
 $("#fb").onpointerdown=()=>{const st=$("#st"),r=$("#fb").getBoundingClientRect(),s=st.getBoundingClientRect();for(let i=0;i<8;i++){const d=document.createElement("i");d.className="shot";d.style.left=r.left-s.left+r.width/2+"px";d.style.top=r.top-s.top+r.height/2+"px";d.style.setProperty("--x",(-60-Math.random()*200)+"px");d.style.setProperty("--y",(Math.random()*120-60)+"px");st.appendChild(d);setTimeout(()=>d.remove(),700)}}}
/* bong bóng */
(function(){const c=$("#fx"),x=c.getContext("2d");let w,h,P=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight};rs();addEventListener("resize",rs);
 const mk=f=>({x:Math.random()*w,y:f?Math.random()*h:h+60,r:Math.random()*34+6,v:Math.random()*.6+.2,d:Math.random()*6,a:Math.random()*.25+.18});
 for(let i=0;i<34;i++)P.push(mk(1));
 (function t(){x.clearRect(0,0,w,h);for(const p of P){p.y-=p.v;p.x+=Math.sin(p.y/55+p.d)*.5;if(p.y<-70)Object.assign(p,mk(0));
  const g=x.createRadialGradient(p.x-p.r*.35,p.y-p.r*.35,p.r*.1,p.x,p.y,p.r);g.addColorStop(0,"rgba(220,245,255,"+p.a+")");g.addColorStop(.6,"rgba(61,184,255,"+p.a*.25+")");g.addColorStop(1,"rgba(61,184,255,"+p.a*.7+")");
  x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=g;x.fill();x.lineWidth=1.2;x.strokeStyle="rgba(170,225,255,"+(p.a+.15)+")";x.stroke();
  x.beginPath();x.arc(p.x-p.r*.4,p.y-p.r*.4,p.r*.16,0,7);x.fillStyle="rgba(255,255,255,"+(p.a+.3)+")";x.fill()}requestAnimationFrame(t)})()})();
const s=ls.get("ffs_session");if(s&&users()[s])enter(s);
</script>
</body>
</html>
